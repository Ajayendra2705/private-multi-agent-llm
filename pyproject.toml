[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "private-multi-agent-llm"
version = "0.1.0"
description = "Optimising Privacy-Utility Trade-offs in Multi-Agent LLM Networks Using Nature-Inspired Metaheuristics"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ajayendra Kumar Bansod" },
]

dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "langchain>=0.1.0",
    "pydantic>=2.6.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "jupyter>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
known_first_party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
